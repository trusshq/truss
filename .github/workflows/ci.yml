name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  kernel:
    name: Kernel — smoke suites (471 checks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel
    env:
      TRUSS_DATABASE_URL: postgresql+asyncpg://truss:ci-pg-pw-not-for-prod@127.0.0.1:5432/truss
      TRUSS_JWT_SECRET: ci-jwt-secret-not-for-prod
      TRUSS_AI_VAULT_SECRET: ci-vault-secret-not-for-prod
      TRUSS_DEBUG: "false"
      # connector test: point the external-postgres adapter at the CI service
      TRUSS_TEST_PG_HOST: 127.0.0.1
      TRUSS_TEST_PG_PORT: "5432"
      TRUSS_TEST_PG_DB: truss
      TRUSS_TEST_PG_USER: truss
      TRUSS_TEST_PG_PASSWORD: "ci-pg-pw-not-for-prod"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: truss
          POSTGRES_PASSWORD: "ci-pg-pw-not-for-prod"
          POSTGRES_DB: truss
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U truss"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # --no-install-project: the local package layout (src/kernel) isn't
        # installable; we run the source tree directly. Same fix as Dockerfile.
        run: uv sync --no-install-project

      - name: Sanity check (import app + venv layout)
        run: |
          ls -la .venv/bin | head -20
          .venv/bin/python -c "import truss_kernel.main; print('import OK')"

      - name: Run all smoke suites
        # Start uvicorn as a REAL background process in THIS step (so it isn't
        # torn down between steps) with its genuine stdout/stderr in kernel.log.
        # Then run the suites against it. Everything on 127.0.0.1, same host.
        # On failure we emit kernel.log as ::error:: annotations because the
        # step log + artifacts are auth-gated but annotations are public.
        run: |
          set +e

          echo "== preflight: DB reachability =="
          .venv/bin/python -c "import socket; s=socket.create_connection(('127.0.0.1',5432),timeout=5); s.close(); print('DB TCP 127.0.0.1:5432 OK')" || echo "::error::DB TCP connect to 127.0.0.1:5432 FAILED"

          echo "== starting kernel =="
          .venv/bin/python -m uvicorn truss_kernel.main:app --host 127.0.0.1 --port 8000 > kernel.log 2>&1 &
          KERNEL_PID=$!
          echo "kernel started (pid $KERNEL_PID)"

          healthy=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null 2>&1; then
              healthy=1
              echo "kernel healthy after ${i}s"
              break
            fi
            # surface an early crash immediately
            if ! kill -0 $KERNEL_PID 2>/dev/null; then
              echo "::error::kernel process exited early"
              break
            fi
            sleep 1
          done

          if [ "$healthy" != "1" ]; then
            echo "::error::kernel did not become healthy in 60s"
            echo "--- kernel.log (last 80 lines) ---"
            tail -n 80 kernel.log
            # Emit the log as public annotations (step logs are auth-gated).
            tail -n 30 kernel.log | while IFS= read -r line; do
              echo "::error::LOG: $line"
            done
            exit 1
          fi

          .venv/bin/python run_all_tests.py
          RC=$?
          kill $KERNEL_PID 2>/dev/null
          exit $RC

      - name: Kernel logs (on failure)
        if: failure()
        run: tail -n 120 kernel.log

      - name: Upload kernel log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-log
          path: kernel/kernel.log

  frontend:
    name: Frontend — production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: Docker — compose config valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet

  docker-build:
    name: Docker — build kernel + frontend images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build kernel image
        run: docker build -t truss-kernel:ci ./kernel

      - name: Build frontend image
        run: docker build -t truss-frontend:ci ./frontend

      - name: Smoke — kernel image boots against Postgres and serves /api/health
        run: |
          set -e
          docker network create truss-ci
          docker run -d --name truss-pg --network truss-ci \
            -e POSTGRES_USER=truss -e POSTGRES_PASSWORD=ci-pg-pw-not-for-prod -e POSTGRES_DB=truss \
            postgres:16-alpine
          # wait for pg
          for i in $(seq 1 30); do
            docker exec truss-pg pg_isready -U truss >/dev/null 2>&1 && break
            sleep 1
          done
          docker run -d --name truss-kernel-ci --network truss-ci \
            -e TRUSS_DATABASE_URL=postgresql+asyncpg://truss:ci-pg-pw-not-for-prod@truss-pg:5432/truss \
            -e TRUSS_JWT_SECRET=ci-jwt-secret-not-for-prod \
            -e TRUSS_AI_VAULT_SECRET=ci-vault-secret-not-for-prod \
            -p 8010:8000 truss-kernel:ci
          healthy=0
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8010/api/health >/dev/null 2>&1; then healthy=1; break; fi
            if ! docker ps --filter name=truss-kernel-ci --filter status=running -q | grep -q .; then
              echo "::error::kernel container exited early"
              docker logs truss-kernel-ci 2>&1 | tail -40
              exit 1
            fi
            sleep 2
          done
          if [ "$healthy" != "1" ]; then
            echo "::error::kernel image did not become healthy"
            docker logs truss-kernel-ci 2>&1 | tail -40
            exit 1
          fi
          echo "kernel image healthy — /api/health OK"
          curl -s http://127.0.0.1:8010/api/health
