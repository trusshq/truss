name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  kernel:
    name: Kernel — smoke suites (181 checks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel
    env:
      TRUSS_DATABASE_URL: postgresql+asyncpg://truss:truss@127.0.0.1:5432/truss
      TRUSS_JWT_SECRET: ci-jwt-secret-not-for-prod
      TRUSS_AI_VAULT_SECRET: ci-vault-secret-not-for-prod
      TRUSS_DEBUG: "false"
      # connector test: point the external-postgres adapter at the CI service
      TRUSS_TEST_PG_HOST: 127.0.0.1
      TRUSS_TEST_PG_PORT: "5432"
      TRUSS_TEST_PG_DB: truss
      TRUSS_TEST_PG_USER: truss
      TRUSS_TEST_PG_PASSWORD: "***"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: truss
          POSTGRES_PASSWORD: "***"
          POSTGRES_DB: truss
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U truss"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # --no-install-project: the local package layout (src/kernel) isn't
        # installable; we run the source tree directly. Same fix as Dockerfile.
        run: uv sync --no-install-project

      - name: Sanity check (import app + venv layout)
        run: |
          ls -la .venv/bin | head -20
          .venv/bin/python -c "import truss_kernel.main; print('import OK')"

      - name: Run all smoke suites
        # The runner spawns the kernel itself (TRUSS_TEST_SPAWN_KERNEL=1) so it
        # stays alive for the whole run — a backgrounded `nohup` from a prior
        # step gets torn down by the Actions process-group between steps.
        env:
          TRUSS_TEST_SPAWN_KERNEL: "1"
        run: .venv/bin/python run_all_tests.py

      - name: Kernel logs (on failure)
        if: failure()
        run: tail -n 120 kernel.log

      - name: Upload kernel log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-log
          path: kernel/kernel.log

  frontend:
    name: Frontend — production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: Docker — compose config valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
